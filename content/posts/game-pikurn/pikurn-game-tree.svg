<g font-size="17" fill="#c6cbd2"><text x="90" y="370">bet $50</text><text x="430" y="302">bet $50</text><text x="430" y="467">bet $50</text><text x="285" y="235" fill="#50d9bd">● G · ⅔</text><text x="285" y="393" fill="#ff9585">◆ R · ⅓</text><text x="620" y="203" fill="#50d9bd">● G</text><text x="620" y="309" fill="#ff9585">◆ R</text><text x="620" y="400" fill="#50d9bd">● G</text><text x="897" y="208" fill="#ff9585">◆ R · bet $0</text><text x="897" y="308" fill="#50d9bd">● G · all-in</text><text x="897" y="408" fill="#50d9bd">● G · all-in</text></g>
<g font-size="29" fill="#50d9bd" font-weight="bold"><text x="1070" y="255">$200</text><text x="1070" y="355">$200</text><text x="1070" y="455">$200</text></g>
