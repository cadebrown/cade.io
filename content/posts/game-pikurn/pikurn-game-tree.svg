<rect x="415" y="367" width="150" height="72" rx="12"/>
<rect x="735" y="197" width="130" height="50" rx="8"/>
<rect x="735" y="297" width="130" height="50" rx="8"/>
<rect x="735" y="397" width="130" height="50" rx="8"/>
</g>
