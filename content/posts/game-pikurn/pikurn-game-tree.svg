<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Pikurn: three draws, $200 guaranteed</title>
<desc id="desc">Start with $100, wager $50. After green, wager $50 of $150. After red, double the remaining $50 twice. Each of GGR, GRG, and RGG ends at $200.</desc>
<rect width="1200" height="630" fill="#222"/>
<g font-family="monospace" fill="#eee">
<text x="65" y="76" font-size="20" letter-spacing="4" fill="#b9c1cc">PIKURN / THE ADAPTIVE HEDGE</text>
<text x="65" y="136" font-size="42" font-weight="bold">Three draws. $200, guaranteed.</text>
<g stroke-width="3" fill="none">
<path d="M170 300L460 240M170 300L460 400" stroke="#8796a5"/>
<path d="M530 240L785 220M530 240L785 320M530 400L785 420" stroke="#8796a5"/>
<path d="M855 220H1090M855 320H1090M855 420H1090" stroke="#8796a5"/>
</g>
<g fill="#222" stroke="#b9c1cc" stroke-width="2">
<rect x="70" y="266" width="150" height="76" rx="12"/>
